name: Sync live API reference

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-api-reference
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Read and validate the production OpenAPI contract
        run: python3 scripts/sync-openapi.py
      - name: Publish changed reference
        run: |
          if git diff --quiet -- openapi.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- openapi.json
          git commit -m 'Update API reference from production'
          git push origin HEAD:main
